<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Laboratorio · CRM</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="shared/styles.css">
<style>
  body { height: 100vh; overflow: hidden; }
  .shell { display: grid; grid-template-columns: 84px 1fr; height: 100vh; padding: 14px; gap: 14px; }
  .side { background: var(--dark); border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; margin-bottom: 18px; letter-spacing: -0.04em; }
  .nav { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; color: #b5b5b5; text-decoration: none; position: relative; transition: background .15s, color .15s; }
  .nav:hover { color: #fff; background: #4a4a4a; }
  .nav.on { background: #fff; color: var(--ink); }
  .nav .tip { position: absolute; left: 58px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-4px); transition: .12s; z-index: 5; }
  .nav:hover .tip { opacity: 1; transform: none; }
  .nav .badge { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .side .spacer { flex: 1; }

  .main { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 4px 6px 0; }
  .search { position: relative; width: 300px; }
  .search .svg-i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; }
  .search input { padding-left: 40px; border-radius: 999px; background: var(--card); border-color: transparent; }
  .conn { background: var(--card); border-radius: 999px; padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .account { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 600; }

  .content { overflow: auto; min-height: 0; padding-bottom: 20px; border-radius: var(--r-md); }
  .content > .view { animation: rise .2s ease; }
  .aside { background: var(--card); border-radius: var(--r-lg); padding: 20px; overflow: auto; min-height: 0; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f0f0f0; }
  .feed li:last-child { border: 0; }
  .feed .ic { width: 34px; height: 34px; border-radius: 12px; background: #f2f2f2; display: grid; place-items: center; flex: none; color: var(--dark); }
  .feed .ic .svg-i { width: 17px; }
  .feed li.app .ic { background: var(--accent-soft); color: #2f6db3; }
  .feed li.fresh { animation: rise .3s ease; }
  .feed li.fresh .ic { animation: pulse 1.2s ease 2; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi { background: var(--card); border-radius: var(--r-md); padding: 18px 20px; }
  .kpi.dark { background: var(--dark); color: #fff; }
  .kpi.dark .muted { color: #b5b5b5; }
  .kpi .val { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; }
  .grid-even { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .legend { display: grid; gap: 7px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend b { margin-left: auto; font-weight: 600; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 0 14px; flex-wrap: wrap; }

  .slots { display: grid; gap: 8px; }
  .slot { display: grid; grid-template-columns: 70px 80px 1fr; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px 14px; min-height: 58px; }
  .slot.past { opacity: .55; }
  .slot .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter { display: flex; gap: 4px; }
  .meter i { width: 22px; height: 8px; border-radius: 4px; background: #ececec; }
  .meter i.on { background: var(--dark); }
  .meter.full i.on { background: var(--bad); }
  .appts { display: flex; gap: 8px; flex-wrap: wrap; }
  .appt { background: #f5f5f5; border-radius: 12px; padding: 7px 10px; display: flex; align-items: center; gap: 10px; min-width: 260px; }
  .appt.app { background: var(--accent-soft); }
  .appt.new { animation: arrive 1.4s ease; }
  .appt select { border: 0; background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; }

  .param-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 90px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .price-in { width: 90px; text-align: right; padding: 6px 10px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 300px; overflow: auto; }
  .checks label { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; background: #f7f7f7; cursor: pointer; font-size: 13px; }
  .checks label:has(input:checked) { background: var(--accent-soft); }
  .checks .p { margin-left: auto; color: var(--muted); }
  .tabs { display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; gap: 2px; }
  .tabs button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--dark); color: #fff; }

  @media (max-width: 1250px) { .main { grid-template-columns: 1fr; } .aside { display: none; } .kpis { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .grid2, .grid-even { grid-template-columns: 1fr; } .search { display: none; } .slot { grid-template-columns: 60px 1fr; } .slot .appts { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="view"></main>
    <aside class="aside" id="aside"></aside>
  </div>
</div>
<script type="module" src="crm.js"></script>
</body>
</html>
